<script>
    // ... (весь CSS и HTML из прошлого сообщения оставляем) ...

    function addNewNFT() {
        const link = document.getElementById('nft-link').value;
        if(!link.includes('t.me/')) { alert("Вставь правильную ссылку!"); return; }
        
        // Красивое имя для визуала
        const name = link.split('/').pop().replace('-', ' ');
        
        const newNFT = {
            id: Date.now(),
            name: name,
            link: link,
            status: 'on'
        };
        
        nfts.push(newNFT);
        renderNFTs();
        
        // ОТПРАВЛЯЕМ БОТУ, ЧТОБЫ ОН СДЕЛАЛ ЕГО НАСТОЯЩИМ
        tg.sendData("add_" + link); 
        
        hideModal();
        document.getElementById('nft-link').value = "";
    }

    function updateStatus(id, status) {
        const nft = nfts.find(n => n.id === id);
        if(nft) {
            nft.status = status;
            // Если выключаем - шлем боту ссылку, чтобы он удалил её из рандома
            if(status === 'off') {
                tg.sendData("status_off_" + nft.link);
            } else {
                tg.sendData("add_" + nft.link);
            }
            renderNFTs();
        }
    }
</script>
