<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0e0e0e; color: #fff; padding: 15px; text-align: center; }
        h1 { color: #0088cc; font-size: 20px; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 1px; }
        
        .nft-card {
            background: #1c1c1c;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .nft-title { font-size: 18px; font-weight: bold; color: #0088cc; margin-bottom: 8px; }
        .nft-desc { font-size: 13px; color: #888; margin-bottom: 15px; }
        
        .btn-link {
            display: inline-block;
            background: #0088cc;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-link:active { transform: scale(0.95); opacity: 0.8; }
        
        .status { font-size: 11px; text-transform: uppercase; color: #00ff00; margin-top: 10px; display: block; }
    </style>
</head>
<body>
    <h1>📦 СКЛАД NFT_LUDKAA</h1>

    <div class="nft-card">
        <div class="nft-title">🧦 Fresh Socks #8418</div>
        <div class="nft-desc">Официальный NFT подарок Telegram</div>
        <a href="https://t.me/nft/FreshSocks-8418" class="btn-link">ОТКРЫТЬ В TG</a>
        <span class="status">● Готов к выдаче</span>
    </div>

    <div class="nft-card">
        <div class="nft-title">🧁 Whip Cupcake #142951</div>
        <div class="nft-desc">Официальный NFT подарок Telegram</div>
        <a href="https://t.me/nft/WhipCupcake-142951" class="btn-link">ОТКРЫТЬ В TG</a>
        <span class="status">● Готов к выдаче</span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на всё окно
    </script>
</body>
</html>
