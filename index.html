<script>
// Адрес твоего запущенного бота
const BOT_SERVER = 'http://localhost:8080/update';

// Эту функцию вызывай при добавлении NFT на сайте
async function syncAdd(link, name) {
    try {
        const response = await fetch(BOT_SERVER, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'add', link: link, name: name })
        });
        if (response.ok) console.log("✅ Добавлено в базу бота");
    } catch (err) {
        console.error("❌ Бот не в сети или ошибка запроса");
    }
}

// Эту функцию вызывай при удалении NFT на сайте
async function syncDelete(link) {
    try {
        const response = await fetch(BOT_SERVER, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'delete', link: link })
        });
        if (response.ok) console.log("🗑 Удалено из базы бота");
    } catch (err) {
        console.error("❌ Бот не в сети или ошибка запроса");
    }
}
</script>
