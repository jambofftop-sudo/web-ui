<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СКЛАД NFT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .card { background: #242424; border-radius: 12px; padding: 20px; border: 1px solid #333; }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #111; color: white; }
        button { width: 95%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 6px; font-weight: bold; margin-top: 10px; }
        #status { font-size: 0.8em; margin-bottom: 15px; padding: 5px; border-radius: 4px; }
        .ok { background: #1b4332; color: #75f9a7; }
        .err { background: #431b1b; color: #f97575; }
    </style>
</head>
<body>
    <div class="card">
        <h3>📦 СКЛАД NFT</h3>
        <div id="status" class="err">Синхронизация...</div>
        
        <input type="text" id="link" placeholder="Ссылка на NFT">
        <input type="text" id="name" placeholder="Название">
        <button onclick="send('add')">ДОБАВИТЬ</button>
        <hr style="border: 0.1px solid #333; margin: 20px 0;">
        <div id="list"></div>
    </div>

    <script>
        const API = 'http://45.136.56.194:8080';

        async function load() {
            const st = document.getElementById('status');
            try {
                const r = await fetch(`${API}/get_db`);
                const data = await r.json();
                st.innerText = "● СЕРВЕР ПОДКЛЮЧЕН";
                st.className = "ok";
                render(data);
            } catch (e) {
                st.innerText = "❌ НЕТ СВЯЗИ (Нажми кнопку ниже)";
                st.className = "err";
                // Если не удалось подключиться, выводим кнопку-помощник
                document.getElementById('list').innerHTML = `<button onclick="window.open('${API}/get_db', '_blank')">РАЗРЕШИТЬ ДОСТУП</button>`;
            }
        }

        async function send(action) {
            const link = document.getElementById('link').value;
            const name = document.getElementById('name').value;
            await fetch(`${API}/update`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action, link, name })
            });
            load();
        }

        function render(data) {
            const container = document.getElementById('list');
            container.innerHTML = data.map(i => `<div style="margin:5px; font-size:0.9em;">${i.name}</div>`).join('');
        }

        window.onload = load;
    </script>
</body>
</html>
