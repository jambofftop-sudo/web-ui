<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuludka Sync v3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; padding: 20px; text-align: center; }
        .nft-card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; }
        .btn-send { width: 100%; padding: 12px; background: #0088cc; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-add { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; border-radius: 50%; background: #00cc66; color: #000; font-size: 30px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <h3>📦 СИНХРОНИЗАЦИЯ СКЛАДА</h3>
    <div id="list"></div>
    <button class="btn-add" onclick="addNFT()">+</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let nfts = JSON.parse(localStorage.getItem('z_nfts')) || [];

        function render() {
            const container = document.getElementById('list');
            container.innerHTML = "";
            nfts.forEach((nft, index) => {
                const div = document.createElement('div');
                div.className = 'nft-card';
                div.innerHTML = `
                    <b style="color:#0088cc">${nft.name}</b><br><br>
                    <button class="btn-send" onclick="syncBot('${nft.link}')">ОТПРАВИТЬ В БОТА</button>
                    <button onclick="remove(${index})" style="background:none; border:none; color:gray; font-size:10px; margin-top:10px; width:100%">УДАЛИТЬ ИЗ ТЕЛЕФОНА</button>
                `;
                container.appendChild(div);
            });
            localStorage.setItem('z_nfts', JSON.stringify(nfts));
        }

        function syncBot(link) {
            // Шлем данные. Работает ТОЛЬКО через Reply-кнопку в боте!
            tg.sendData("add_" + link);
        }

        function addNFT() {
            const link = prompt("Вставь ссылку t.me/nft/...");
            if(link && link.includes('t.me/')) {
                const name = link.split('/').pop().replace('-', ' ');
                nfts.push({ name: name, link: link });
                render();
            }
        }

        function remove(index) {
            nfts.splice(index, 1);
            render();
        }

        render();
    </script>
</body>
</html>
