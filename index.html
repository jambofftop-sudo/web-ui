<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Склад - Zuludka</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0e0e0e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 22px;
            color: #0088cc;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .nft-container {
            width: 100%;
            max-width: 400px;
        }

        .nft-card {
            background: #1c1c1c;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nft-info {
            text-align: left;
        }

        .nft-name {
            font-weight: bold;
            color: #0088cc;
        }

        /* Кнопка добавления (+) */
        .add-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #0088cc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }

        .add-button:active {
            transform: scale(0.9);
        }

        /* Модальное окно */
        #modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #0088cc;
            width: 85%;
            z-index: 1000;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background: #111;
            color: white;
            box-sizing: border-box;
        }

        .save-btn {
            background: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>📦 МОЙ СКЛАД NFT</h1>

    <div class="nft-container" id="nft-list">
        <div class="nft-card">
            <div class="nft-info">
                <div class="nft-name">🧦 Fresh Socks #8418</div>
            </div>
        </div>
        <div class="nft-card">
            <div class="nft-info">
                <div class="nft-name">🧁 Whip Cupcake #142951</div>
            </div>
        </div>
    </div>

    <button class="add-button" onclick="openModal()">+</button>

    <div id="modal">
        <h3>Добавить новый NFT</h3>
        <input type="text" id="nft-input" placeholder="Вставь ссылку на NFT">
        <button class="save-btn" onclick="saveNFT()">СОХРАНИТЬ</button>
        <button onclick="closeModal()" style="background:none; border:none; color:#888; margin-top:10px; width:100%;">Отмена</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function openModal() {
            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function saveNFT() {
            const link = document.getElementById('nft-input').value;
            if (link.trim() !== "") {
                // Отправляем ссылку в бот через механизм WebApp
                tg.sendData(link); 
                tg.close(); // Закрываем приложение после отправки
            } else {
                alert("Пожалуйста, вставь ссылку!");
            }
        }
    </script>
</body>
</html>
