<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0e0e0e; color: #fff; margin: 0; padding: 20px; }
        h2 { text-align: center; color: #0088cc; font-size: 18px; text-transform: uppercase; }
        .nft-card { background: #1c1c1c; border: 1px solid #333; border-radius: 16px; padding: 20px; margin-bottom: 20px; position: relative; }
        .nft-name { font-weight: bold; font-size: 15px; color: #0088cc; display: block; margin-bottom: 15px; }
        .btn-status { width: 100%; padding: 12px; font-size: 12px; font-weight: bold; border-radius: 10px; border: none; background: #00cc66; color: #000; cursor: pointer; }
        .btn-tg { display: block; margin-top: 10px; padding: 10px; background: #333; color: #fff; border-radius: 8px; text-decoration: none; text-align: center; font-size: 11px; }
        .btn-delete { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #ff4444; font-size: 18px; }
        .btn-add { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; border-radius: 50%; background: #0088cc; color: #fff; border: none; font-size: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <h2>📦 СКЛАД ZULUDKA</h2>
    <div id="nft-list"></div>
    <button class="btn-add" onclick="addNFT()">+</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let nfts = JSON.parse(localStorage.getItem('z_nfts')) || [];

        function render() {
            const list = document.getElementById('nft-list');
            list.innerHTML = "";
            nfts.forEach(nft => {
                const card = document.createElement('div');
                card.className = 'nft-card';
                card.innerHTML = `
                    <button class="btn-delete" onclick="delNFT(${nft.id})">🗑</button>
                    <span class="nft-name">💎 ${nft.name}</span>
                    <button class="btn-status" onclick="sendToBot('${nft.link}')">АКТИВИРОВАТЬ В БОТЕ</button>
                    <a href="${nft.link}" class="btn-tg">ПРОВЕРИТЬ В TG</a>
                `;
                list.appendChild(card);
            });
            localStorage.setItem('z_nfts', JSON.stringify(nfts));
        }

        function sendToBot(link) {
            tg.sendData("add_" + link); // Отправка данных боту [cite: 2026-02-06]
            tg.close(); // Закрываем веб-апп, чтобы бот обработал данные
        }

        function addNFT() {
            const link = prompt("Вставь ссылку t.me/nft/...");
            if(link && link.includes('t.me/')) {
                const name = link.split('/').pop().replace('-', ' ');
                nfts.push({ id: Date.now(), name: name, link: link });
                render();
            }
        }

        function delNFT(id) {
            const nft = nfts.find(n => n.id === id);
            if(nft) {
                tg.sendData("del_" + nft.link);
                nfts = nfts.filter(n => n.id !== id);
                render();
                tg.close();
            }
        }

        render();
    </script>
</body>
</html>
